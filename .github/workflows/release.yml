name: Release

# 发布方式（任选其一）：
#   1. 修改 hdr2sdr_eetf.py 中的 __version__ 并推送到 main —— 若 v<版本号> 标签尚不存在，自动打标签并发布
#   2. 手动推送 v* 标签
#   3. 手动运行（workflow_dispatch）—— 仅构建与冒烟测试；版本号是新的才发布
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          ver=$(python3 -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('hdr2sdr_eetf.py', encoding='utf-8').read()).group(1))")
          tag="v$ver"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "$tag" ]; then
              echo "::error::标签 $GITHUB_REF_NAME 与代码版本 $tag 不一致"; exit 1
            fi
            release=true
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            release=false
            echo "::notice::$tag 已存在，本次只构建不发布（发布新版请修改 __version__）"
          else
            release=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "版本 $tag，发布：$release"

  test:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  build:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: hdr2sdr-windows-x64.exe
          - os: macos-latest
            asset: hdr2sdr-macos-arm64
          - os: macos-15-intel
            asset: hdr2sdr-macos-x64
          - os: ubuntu-22.04
            asset: hdr2sdr-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install . pyinstaller

      - name: Build executable
        shell: bash
        run: |
          pyinstaller --onefile --name hdr2sdr \
            --collect-all imagecodecs --collect-all pillow_heif \
            --hidden-import tifffile --hidden-import tkinter --hidden-import tkinter.filedialog \
            hdr2sdr_eetf.py
          if [ "$RUNNER_OS" = "Windows" ]; then src=dist/hdr2sdr.exe; else src=dist/hdr2sdr; fi
          mv "$src" "dist/${{ matrix.asset }}"

      - name: Smoke test
        shell: bash
        run: |
          python tests/scene.py smoke
          exe="./dist/${{ matrix.asset }}"
          "$exe" --version
          for f in smoke/pq.avif smoke/pq.jxl smoke/pq.png smoke/hlg.avif smoke/linear.exr; do
            out="${f%.*}_${f##*.}_out.jpg"
            "$exe" "$f" -o "$out"
            test -s "$out"
          done
          if [ -f smoke/pq.heic ]; then "$exe" smoke/pq.heic -o smoke/heic_out.png --bits 16; test -s smoke/heic_out.png; fi
          if "$exe" smoke/sdr.avif -o smoke/should_fail.jpg; then echo "SDR input should be refused"; exit 1; fi
          # 批量模式：多个文件，按 --format 在原文件旁输出
          "$exe" smoke/pq.avif smoke/hlg.avif --format png
          test -s smoke/pq_sdr.png && test -s smoke/hlg_sdr.png
          # 不带参数（模拟双击）：无图形界面时走控制台输入，空输入应正常退出而不是卡住
          if [ "$RUNNER_OS" = "Linux" ]; then printf '\n\n' | "$exe" || true; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Add script & checksums
        run: |
          cp hdr2sdr_eetf.py requirements.txt assets/
          cd assets && sha256sum * > SHA256SUMS.txt && ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: assets/*
          generate_release_notes: true
